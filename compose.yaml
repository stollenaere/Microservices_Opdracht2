name: it-support-stack

services:
  
  ticket:
    image: nfrastack/freescout:2.2.24-alpine
    container_name: ticket
    volumes:
      - ticket_data:/data #Installed modules and persistent storage (logs, attachments, etc)
    ports: 
      - 80:80
    networks:
      - support
    environment:
      APP_URL: http://ticket.sto-clo-howest.be #${FREESCOUT_APP_URL}
      ADMIN_FIRSTNAME: ${FREESCOUT_ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${FREESCOUT_ADMIN_LASTNAME}
      ADMIN_EMAIL: ${FREESCOUT_ADMIN_EMAIL}
      ADMIN_PASS: ${FREESCOUT_ADMIN_PASS}
      DB_TYPE: mariadb
      DB_PORT: 3306
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: ${FREESCOUT_DB_PASS}
      DB_HOST: free_db
      FREESCOUT_HTTPS: "false"
    depends_on:
      - free_db

  free_db:
    image: mariadb:13.0.2
    container_name: ticket_db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWD}
      MARIADB_USER: freescout
      MARIADB_PASSWORD: ${FREESCOUT_DB_PASS}
      MARIADB_DATABASE: freescout
    networks:
      - support
    volumes:
      - free_db_files:/var/lib/mysql

  wiki:
    image: solidnerd/bookstack:26.9
    container_name: wiki
    ports:
      - 8080:8080
    networks:
      - support
    environment:
      DB_HOST: book_db:3306
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${WIKI_DB_PASSWORD}
      APP_URL: ${WIKI_APP_URL}
      APP_KEY: ${WIKI_APP_KEY}
    volumes:
      - wiki_public:/var/www/bookstack/public/uploads
      - wiki_storage:/var/www/bookstack/storage/uploads
    depends_on:
      - book_db

  book_db:
    image: mariadb:13.0.2
    container_name: wiki_db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWD}
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${WIKI_DB_PASSWORD}
      MARIADB_DATABASE: bookstack
    networks:
      - support
    volumes:
      - book_db_files:/var/lib/mysql

  
  kuma:
    image: louislam/uptime-kuma:2.5.9
    container_name: kuma
    volumes:
      - kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8081:3001
    networks:
      - support
    restart: always


networks:
  support:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.10.0/24
          gateway: 172.20.10.1

volumes:
  ticket_data:
  free_db_files:
  wiki_public:
  wiki_storage:
  book_db_files:
  kuma_data:
      
