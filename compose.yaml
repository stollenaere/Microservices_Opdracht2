name: it-support-stack

services:
  
  ticket:
    image: nfrastack/freescout:2.2.24-alpine
    volumes:
      - ticket_data:/data #Installed modules and persistent storage (logs, attachments, etc)
    ports: 
      - 80:80
    networks:
      - support
    environment:
      APP_URL: http://ticket.sto-clo-howest.be
      ADMIN_FIRSTNAME: ${FREESCOUT_ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${FREESCOUT_ADMIN_LASTNAME}
      ADMIN_EMAIL: ${FREESCOUT_ADMIN_EMAIL}
      ADMIN_PASS: ${FREESCOUT_ADMIN_PASS}
      DB_TYPE: mariadb
      DB_PORT: 3306
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: ${FREESCOUT_DB_PASS}
      DB_HOST: free_db
      FREESCOUT_HTTPS: "false"

  free_db:
    image: mariadb:13.0.2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWD}
      MARIADB_USER: freescout
      MARIADB_PASSWORD: ${FREESCOUT_DB_PASS}
      MARIADB_DATABASE: freescout
    networks:
      - support
    volumes:
      - free_db_files:/var/lib/mysql
  
networks:
  support:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.10.0/24
          gateway: 172.20.10.1

volumes:
  ticket_data:
  free_db_files:
      
